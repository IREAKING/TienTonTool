name: Build & Release TienTonTool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        working-directory: wails_dichtruyen
        run: |
          wails build

      - name: Package DMG Installer
        run: |
          mkdir -p build_dmg
          cp -R wails_dichtruyen/build/bin/TienTonTool.app build_dmg/
          ln -s /Applications build_dmg/Applications
          hdiutil create -volname "Tiên Tôn Tool" -srcfolder build_dmg -ov -format UDZO TienTonTool-macOS.dmg
          rm -rf build_dmg

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: TienTonTool-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
